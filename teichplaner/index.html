.mon{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.mon:last-child{border:0}.mon .mn{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font:800 14px/1 var(--f-display);background:var(--well);border:1px solid var(--line);color:var(--mu)}.mon.now .mn{background:var(--ember);color:var(--ember-ink);border-color:transparent}.mon ul{margin:0;padding-left:18px}.mon li{margin:2px 0}
.zone{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:999px;background:rgba(120,210,200,.14);color:#9fe6dc}
.ftemp{display:flex;gap:10px;align-items:center}.ftemp input{max-width:110px;text-align:right}
.ban{border-color:rgba(255,111,125,.35)}
.seg button{font-size:12.5px}
@media (max-width:380px){.shp{grid-template-columns:repeat(2,1fr)}.seg button{font-size:11px}}

.livewrap{position:relative;border-radius:18px;overflow:hidden;margin:0 0 12px;box-shadow:0 18px 40px rgba(0,0,0,.35),inset 0 0 0 1px var(--line)}
canvas.live{width:100%;display:block;touch-action:manipulation;cursor:pointer}
.livehint{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;align-items:center;font-size:12px;font-weight:600;color:#eafff9;background:rgba(2,16,18,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-radius:999px;padding:4px 10px;pointer-events:none}
.livehint .ic{width:14px;height:14px;color:var(--sand)}
.swim{animation:swim linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes swim{0%{transform:translateX(0) scaleX(1)}46%{transform:translateX(var(--dx)) scaleX(1)}50%{transform:translateX(var(--dx)) scaleX(-1)}96%{transform:translateX(0) scaleX(-1)}100%{transform:translateX(0) scaleX(1)}}
.sway2{transform-box:fill-box;transform-origin:50% 100%;animation:sway2 5s ease-in-out infinite alternate}
@keyframes sway2{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.bob{transform-box:fill-box;transform-origin:center;animation:bob2 4s ease-in-out infinite}
@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
.ring .rp{animation:ringin 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes ringin{from{stroke-dasharray:0 999}}
.hero2{margin:4px 0 6px}.hero2 .logo{font-size:46px;margin:4px 0 8px;background:linear-gradient(90deg,#fff 0%,#c8fff0 50%,var(--ember) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;font:800 46px/1.05 var(--f-display)}
.hero2 p{color:var(--mu);margin:0 0 14px}
.choice{animation:up .5s cubic-bezier(.2,.8,.2,1) both}.choice+.choice{animation-delay:.08s}
.facts div{animation:up .6s .15s both}
@media (prefers-reduced-motion:reduce){.swim,.sway2,.bob,.ring .rp,.choice,.facts div{animation:none}}

function names(){if(NAMESC)return NAMESC;if(!BASEN){const st=new Set();TD.forEach(f=>{st.add(f.n);f.vars.forEach(v=>st.add(v))});PL.forEach(p=>st.add(p[0]));PLBAN.forEach(p=>st.add(p[0]));[TYPN,FORMN,Object.keys(UFER),BAU,SONNE,FILT,FEEDN,GOALS,EXP,GRPS,ZON,SETS.map(x=>x.n),Object.values(N),MON].forEach(a=>a.forEach(x=>st.add(x)));BASEN=[...st].filter(x=>!NOTERM.has(x))}

function norm(k){const terms=[],vals=[];let x=k;names().forEach(nm=>{if(x.indexOf(nm)<0)return;let hit=false;const id=terms.length;x=x.replace(trx(nm),(m,pre)=>{hit=true;return pre+String.fromCharCode(0xE100+id)});if(hit)terms.push(nm)});
x=x.replace(/-?\d+(?:[.,]\d+)?/g,m=>{vals.push(m);return "{n"+(vals.length-1)+"}"}).replace(/([-])/g,(m,c)=>"{s"+(c.charCodeAt(0)-0xE100)+"}");return {key:x,terms,vals}}
const isPure=k=>/\{s\d+\}/.test(k)&&/^[\s,.;:·×★•✓\-–()%]*$/.test(k.replace(/\{[sn]\d+\}/g,""));
const LABELRE=/^(Futter:|Verhalten:|Konflikt:|Was tun\?|Technik:|Recht:|Platz:|Zucht:|Pflanzen:|Tiere:|Mitbewohner:|Haltung:|Werte:|Erfahrung:|Verantwortung:|Eingewöhnung:|Tiefe:|Wasser:|Winter:|Zone:|Wasserwerte:)\s+([\s\S]+)$/;

function trCore(k){if(!TRD)return null;const i=LIDX[LANG];let d=TRD[k];if(d&&d[i])return d[i];const n=norm(k);d=TRD[n.key];if(d&&d[i])return fillN(d[i],n);if(isPure(n.key))return fillN(n.key,n);
const m=k.match(LABELRE);if(m){const x=trCore(m[1]),y=trCore(m[2].trim());if(x!=null||y!=null)return (x??m[1])+" "+(y??m[2])}
if(k.includes(" · "))return k.split(" · ").map(p=>trCore(p.trim())??p).join(" · ");return null}
function recCore(k){const R=window.__REC,n=norm(k);if(isPure(n.key))return;const m=k.match(LABELRE);if(m){R.add(m[1]);recCore(m[2].trim());return}
if(k.includes(" · ")){k.split(" · ").forEach(p=>{p=p.trim();if(p&&/[A-Za-zÄÖÜäöüß]/.test(p))recCore(p)});return}R.add(n.key)}

function geo(x){x=x||A;const F=FORM[x.form]||FORM.Rechteck,dm=x.dim||{},v=k=>num(dm[k]),t=v("t");let area=null,vol=null;
if(x.form=="Fertigteich"){const lit=v("lit");if(!lit||!t)return null;vol=lit;area=v("l")&&v("b")?0.7*v("l")*v("b"):lit/1000/(t/100*0.6)}

o.innerHTML=`<div class="fhead" style="margin:12px 0">${fishArt(f.n,0,f)}<div class="ft"><b>${esc(f.n)}</b><br><span class="tag ${bad?"er":"ok"}">${bad?"So geht es noch nicht":"Das passt grundsätzlich"}</span></div></div>${items.map(i=>`<div class="row"><span class="tag ${i[0]}">${i[0]=="er"?"!":i[0]=="ok"?"✓":"i"}</span><span style="flex:1">${esc(i[1])}</span></div>`).join("")}${isBan(f)||isVis(f)?"":`<button class="b" onclick="holdNew()">Neuen Teich für ${esc(f.n)} planen</button>`}<button class="b s" onclick="holdAdd(this)">${isVis(f)?"Als beobachtet eintragen":bad?"Trotzdem hier hinzufügen":"Zu diesem Teich hinzufügen"} (${c}×)</button>${plus()&&AIOK?'<button class="b s" onclick="holdAI()">Ausführlich von der KI</button><pre class="ans" id="holdai"></pre>':""}`}
function holdAdd(btn){if(!HOLD)return;const h=HOLD,c=Math.max(1,h.soc=="g"?h.g:1);pushAn(h.n,"adult","u",dat(h),false,c);flyAn(h.n,c,btn,h).then(()=>{toast(h.n+" hinzugefügt");render()})}
function holdNew(){if(!HOLD)return;if(!plus()){PM="plan";paywall("multi");return}const f=HOLD;newA("plan");A.name=f.n;const t=Math.max(f.md||0,60),area=Math.max(2,(f.mv||2000)*1.15/1000/(t/100*0.65)),l=Math.round(Math.sqrt(area*1.6)*2)/2,b=Math.round(area/l*2)/2;A.form="Rechteck";A.dim={l,b,d:"",s:"",t,lit:""};const c=Math.max(1,f.soc=="g"?f.g:1);A.an=[{n:f.n,sz:"adult",m:0,f:0,u:c,d:dat(f)}];if(isFish(f)&&f.lpf>=500){A.filt="Druckfilter";A.pump=true}if(f.lpf>=1000){A.filt="Trommel- oder Vliesfilter";A.uvc=true;A.air=true;A.typ="Koiteich"}if(isTurtle(f))A.fence=true;if(stays(f))A.ice=true;takeFood(true);step=SK().indexOf("tiere");save();render();toast("Neuer Teich angelegt")}
async function holdAI(){if(!needPlus("ki"))return;const name=HOLD?HOLD.n:$("hold").value.trim().slice(0,60).replace(/["<>]/g,"");let o=$("holdai");if(!o){o=document.createElement("pre");o.className="ans";o.id="holdai";$("holdres").appendChild(o)}o.textContent="Denke nach …";try{o.textContent=await aiText(`Du bist erfahrener Teichberater für Anfänger. Teich: ${ctx()} Der Nutzer möchte "${name}" halten. Sage in einfacher Sprache auf Deutsch, ob das geht und was er konkret tun muss (Volumen, Tiefe, Technik, Futter, Mitbewohner, Überwinterung, Recht wie EU-Verbot oder Artenschutz). Gibt es die Art nicht, sage das ehrlich und nenne echte Alternativen. Max. 180 Wörter, ohne Markdown.`)}catch(e){o.textContent=aerr(e)}}

function addClutch(n,i){const v=$("cd"+i).value,c=+$("cc"+i).value||0;if(!v){toast("Bitte ein Datum wählen");return}A.clutch.push({n,date:new Date(v+"T12:00").getTime(),c});save();toast("Eingetragen");render()}

function zuchtView(){const by=byName(),nm=Object.keys(by);let h="";
if(!nm.length)return `<div class="c"><h2>Zucht</h2><p class="mu">Trage zuerst Tiere ein. Dann zeige ich dir Zuchttipps und berechne den Schlupftermin.</p><button class="b s" onclick="openA(${A.id},'wiz',SK().indexOf('tiere'))">${ic("fish")}Tiere eintragen</button></div>`;
nm.forEach((n,i)=>{const o=by[n],d=o.d;let st,cls;
if(isBan(d)){st="Zucht verboten";cls="er"}else if(isWild(d)){st="Vermehrt sich von selbst";cls="ok"}else if(o.m>0&&o.f>0){st="Zuchtpaar vorhanden";cls="ok"}else if(o.m+o.f==0){st=o.c>=2?"Geschlecht unbekannt":"Nur ein Tier";cls="mu"}else{st=o.m?"Für Nachwuchs fehlt ein Weibchen":"Für Nachwuchs fehlt ein Männchen";cls="wa"}
const today=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
h+=`<div class="c"><div class="fhead">${fishArt(n,0,d)}<div class="ft"><b>${esc(n)}</b><br><span class="tag ${cls}">${st}</span></div></div>`;
if(o.m+o.f==0&&o.c>=2&&!isVis(d)&&!isBan(d)&&isFish(d))h+=`<p class="mu tipline">${ic("spark")}<span>Zur Laichzeit erkennst du Männchen oft an weißen Laichpünktchen auf Kiemendeckeln und Brustflossen, Weibchen sind fülliger.</span></p>`;
h+=(d.br||[]).length?`<div class="brl">${d.br.map(x=>`<p>${esc(x)}</p>`).join("")}</div>`:'<p class="mu">Für diese Art habe ich keine Zuchtdaten.</p>';
if(d.bd&&d.bd[1]>0&&!isBan(d)&&!isWild(d)){const L=A.clutch.map((c,k)=>[c,k]).filter(([c])=>c.n==n);h+=`<label class="lb">${repLbl(d.rep)}</label><div class="r"><input type="date" id="cd${i}" value="${today}" aria-label="Datum"><input type="number" id="cc${i}" inputmode="numeric" placeholder="Anzahl" aria-label="Anzahl" style="max-width:110px"></div><button class="b s" onclick="addClutch(${JSON.stringify(n).replace(/"/g,"&quot;")},${i})">${ic("egg")}Eintragen</button>`;
L.forEach(([c,k])=>{const a=c.date+d.bd[0]*DAY,b=c.date+d.bd[1]*DAY,now=Date.now(),days=Math.ceil((a-now)/DAY);const stt=now<a?`<span>Schlupf ab</span> <b data-notr>${fmtD(a)}</b> <span class="tag mu">${days==1?"in 1 Tag":"in "+days+" Tagen"}</span>`:now<=b?'<span class="tag ok">Schlupfzeit läuft</span>':'<span class="tag wa">Schlupfzeit vorbei</span>';h+=`<div class="row"><div><b data-notr>${fmtD(c.date)}</b>${c.c?` · ${c.c} <span>Eier</span>`:""}<div class="mu">${stt}<br><span>Zeitraum</span> <span data-notr>${fmtD(a)} – ${fmtD(b)}</span></div></div><button class="ibtn" onclick="delClutch(${k})" aria-label="Löschen">${ic("trash")}</button></div>`})}
h+=`</div>`});
h+=`<div class="c"><h2>Grundregeln für Nachwuchs im Teich</h2>${BRG.map(t=>`<p class="mu tipline">${ic("check")}<span>${esc(t)}</span></p>`).join("")}</div>`;return h}

function render(){try{render0()}catch(e){console.error(e);$("app").innerHTML='<div class="c"><h2>Hoppla</h2><p class="mu">Etwas ist schiefgelaufen ('+esc(e&&e.message||e)+'). Deine Daten sind noch da.</p><button class="b" onclick="view=\'start\';render()">Zur Startseite</button><button class="b s" onclick="ask(\'Alle Daten löschen?\',()=>{try{localStorage.removeItem(\'tk1\')}catch(e){}location.reload()})">Alles zurücksetzen</button></div>';$("bar").style.display="none"}}
function render0(){const a=$("app");let bar="";
if(view=="start")a.innerHTML=vStart();
else if(view=="mine")a.innerHTML=vMine();
else if(view=="wiz"){a.innerHTML=vWiz();bar=`<button class="b s" onclick="back()">${ic("back")}Zurück</button><button class="b" onclick="next()">${step>=SK().length-1?"Fertig":"Weiter"+ic("chev")}</button>`}
else if(view=="det"){a.innerHTML=vDet();bar=`<button class="b s" onclick="openA(${A.id},'wiz')">Bearbeiten</button><button class="b" onclick="go('mine')">Übersicht</button>`}
else if(view=="set"){a.innerHTML=vSet();bar=`<button class="b" onclick="go('${D.list.length?"mine":"start"}')">Zurück</button>`}
const b=$("bar");b.style.display=bar?"flex":"none";b.innerHTML=bar;
const showAd=!plus()&&view=="wiz";const e=$("ad");e.style.display=showAd?"flex":"none";
if(showAd)e.innerHTML=`<span class="al">Anzeige</span><span class="t">${esc(adTxt())}</span><button onclick="paywall('ads')" aria-label="Werbung entfernen">✕</button>`;
const bh=bar?b.offsetHeight:0;e.style.bottom=bh+"px";document.body.style.paddingBottom=(bh+(showAd?e.offsetHeight:0)+20)+"px";
if(view=="wiz")afterWiz();mountLive();if(view=="start")countUp()}
function countUp(){document.querySelectorAll("[data-count]").forEach(e=>{const n=+e.dataset.count;if(RMO){e.textContent=n;return}const t0=performance.now();const f=t=>{const k=Math.min(1,(t-t0)/1200),v=Math.round(n*(1-Math.pow(1-k,3)));e.textContent=v;if(k<1&&e.isConnected)requestAnimationFrame(f)};requestAnimationFrame(f)})}
bootLang();

(function(){const cv=$("dust");if(!cv||!cv.getContext)return;const cx=cv.getContext("2d"),rm=matchMedia("(prefers-reduced-motion: reduce)").matches,B=[];let W=0,H=0,d=1;
function rs(){d=Math.min(2,devicePixelRatio||1);W=cv.width=innerWidth*d;H=cv.height=innerHeight*d}rs();addEventListener("resize",rs);
for(let i=0;i<26;i++)B.push({x:Math.random(),y:0.25+Math.random()*0.6,r:.8+Math.random()*1.6,vx:(Math.random()-.5)*.0006,vy:(Math.random()-.5)*.0004,w:Math.random()*6.28});
function draw(){cx.clearRect(0,0,W,H);const t=performance.now()/1000;B.forEach(b=>{if(!rm){b.x+=b.vx+Math.sin(t*.7+b.w)*.0003;b.y+=b.vy+Math.cos(t*.5+b.w)*.0002;if(b.x<-.05)b.x=1.05;if(b.x>1.05)b.x=-.05;if(b.y<.15||b.y>.92)b.vy*=-1}const x=b.x*W,y=b.y*H,r=b.r*d,a=.25+.6*Math.max(0,Math.sin(t*1.6+b.w*3));const gr=cx.createRadialGradient(x,y,0,x,y,r*6);gr.addColorStop(0,`rgba(220,255,150,${a})`);gr.addColorStop(1,"rgba(220,255,150,0)");cx.fillStyle=gr;cx.beginPath();cx.arc(x,y,r*6,0,6.283);cx.fill()});if(!rm)requestAnimationFrame(draw)}draw()})();
</script>
