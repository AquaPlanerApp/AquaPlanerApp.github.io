<style>

function lev(a,b){const m=[];for(let i=0;i<=a.length;i++)m[i]=[i];for(let j=1;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return m[a.length][b.length]}
function wd(t,k){const kw=k.toLowerCase().split(/[\s-]+/);let s=0;t.toLowerCase().split(/[\s-]+/).forEach(w=>{s+=Math.min(...kw.map(x=>lev(w,x)))});return s}

const rec=(KL[A.cl]||{}).sub||[],Ls=ks.slice().sort((a,b)=>t?wd(t,a)-wd(t,b):(rec.includes(b)?1:0)-(rec.includes(a)?1:0));
$("bs").innerHTML=(ex?`<p class="mu" style="flex:1 1 100%">✓ Erkannt: ${esc(ex)}</p>`:`<p class="mu" style="flex:1 1 100%">${t?"Meintest du:":"Auswahl:"}</p>`)+Ls.map(k=>`<button class="${ex==k?"on":""}" onclick="bpick(${ks.indexOf(k)})">${rec.includes(k)?"★ ":""}${esc(k)}</button>`).join("")+`<p class="mu" style="flex:1 1 100%">★ passt zu ${esc(A.cl)}</p>`}

/* ---------- Zucht ---------- */
const fmtD=d=>new Date(d).toLocaleDateString(LANG=="pt"?"pt-BR":LANG);
const repLbl=r=>r=="lebend"?"Paarung eintragen":r=="kokon"?"Kokon eintragen":r=="oothek"?"Oothek eintragen":r=="parth"?"Eier eingesammelt":"Gelege eintragen";
function addClutch(n,i){const v=$("cd"+i).value,c=+$("cc"+i).value||0;if(!v){toast("Bitte ein Datum wählen");return}A.clutch.push({n,date:new Date(v+"T12:00").getTime(),c});save();toast("Eingetragen");render()}
function delClutch(k){ask("Eintrag löschen?",()=>{A.clutch.splice(k,1);save();render()})}
function zuchtView(){const by=byName(),nm=Object.keys(by);let h="";
if(!nm.length)return `<div class="c"><h2>Zucht</h2><p class="mu">Trage zuerst Tiere ein. Dann zeige ich dir Zuchttipps, Bruttemperaturen und berechne den Schlupftermin.</p><button class="b s" onclick="openA(${A.id},'wiz',SK().indexOf('tiere'))">${ic("paw")}Tiere eintragen</button></div>`;
nm.forEach((n,i)=>{const o=by[n],d=o.d,parth=d.rep=="parth";let st,cls;
if(parth){st="Weibchen vermehren sich auch allein";cls="lg"}else if(o.m>0&&o.f>0){st="Zuchtpaar vorhanden";cls="ok"}else if(o.m+o.f==0){st="Geschlecht unbekannt";cls="mu"}else{st=o.m?"Für Nachwuchs fehlt ein Weibchen":"Für Nachwuchs fehlt ein Männchen";cls="wa"}
const today=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
h+=`<div class="c"><div class="fhead">${fishArt(n,0,d)}<div class="ft"><b>${esc(n)}</b><br><span class="tag ${cls}">${st}</span></div></div>`;
if(o.m+o.f==0&&!parth)h+=`<p class="mu tipline">${ic("spark")}<span>Lass das Geschlecht beim Händler oder Tierarzt bestimmen und trage es bei den Tieren ein (♂ und ♀).</span></p>`;
if(d.soc=="e"&&o.m>0&&o.f>0)h+=`<p class="mu tipline">${ic("spark")}<span>Diese Art lebt allein: Tiere nur zur Paarung kurz zusammensetzen und beobachten.</span></p>`;
h+=(d.br||[]).length?`<div class="brl">${d.br.map(x=>`<p>${esc(x)}</p>`).join("")}</div>`:'<p class="mu">Für diese Art habe ich keine Zuchtdaten.</p>';
if((d.legal||[]).some(l=>l=="melde"||l=="A"))h+=`<p class="mu tipline">${ic("law")}<span>Nachwuchs muss bei der Naturschutzbehörde gemeldet werden.</span></p>`;
if(d.bd){const L=A.clutch.map((c,k)=>[c,k]).filter(([c])=>c.n==n);h+=`<label class="lb">${repLbl(d.rep)}</label><div class="r"><input type="date" id="cd${i}" value="${today}" aria-label="Datum"><input type="number" id="cc${i}" inputmode="numeric" placeholder="${d.rep=="lebend"?"":"Anzahl"}" aria-label="Anzahl" style="max-width:110px"></div><button class="b s" onclick="addClutch(${JSON.stringify(n).replace(/"/g,"&quot;")},${i})">${ic("egg")}Eintragen</button>`;
L.forEach(([c,k])=>{const a=c.date+d.bd[0]*DAY,b=c.date+d.bd[1]*DAY,now=Date.now(),days=Math.ceil((a-now)/DAY);const stt=now<a?`<span>Schlupf ab</span> <b data-notr>${fmtD(a)}</b> <span class="tag mu">${days==1?"in 1 Tag":"in "+days+" Tagen"}</span>`:now<=b?'<span class="tag ok">Schlupfzeit läuft</span>':'<span class="tag wa">Schlupf überfällig, Eier prüfen</span>';h+=`<div class="row"><div><b data-notr>${fmtD(c.date)}</b>${c.c?` · ${c.c} <span>${d.rep=="lebend"?"Jungtiere erwartet":"Eier"}</span>`:""}<div class="mu">${stt}<br><span>Zeitraum</span> <span data-notr>${fmtD(a)} – ${fmtD(b)}</span></div></div><button class="ibtn" onclick="delClutch(${k})" aria-label="Löschen">${ic("trash")}</button></div>`})}
h+=`</div>`});
h+=`<div class="c"><h2>Grundregeln für die Zucht</h2>${BRG.map(t=>`<p class="mu tipline">${ic("check")}<span>${esc(t)}</span></p>`).join("")}</div>`;return h}

/* ---------- Ansichten ---------- */
function adTxt(){return ADS[D.adi%ADS.length]}
const adCard=()=>plus()?"":`<div class="adc"><span class="al">Anzeige</span><span class="t">${esc(adTxt())}</span><button onclick="paywall('ads')" aria-label="Werbung entfernen">✕</button></div>`;
function vStart(){return `${topBar(true,false)}<section class="hero"><div class="eyebrow">Dein Terrarium-Begleiter</div><h1 class="logo">TerraPlaner</h1><p>Schlangen, Echsen, Geckos, Spinnen und Insekten: Platz, Klima, Futter und Zucht an einem Ort.</p><div class="heroart">${fishArt("Leopardgecko")}</div></section><h2 class="q-title">Wie möchten Sie fortfahren?</h2><button class="choice prim" onclick="choose('have')"><span class="itile">${ic("box")}</span><span class="ct"><b>Ich habe bereits ein Terrarium</b><span>Terrarium erfassen, Haltung prüfen, Pflege planen</span></span>${ic("chev")}</button><button class="choice" onclick="choose('plan')"><span class="itile">${ic("compass")}</span><span class="ct"><b>Ich möchte mir ein Terrarium zulegen</b><span>Das passende Tier finden, mit Einkaufsliste</span></span>${ic("chev")}</button><div class="facts"><div><b>${TD.length}</b><span>Arten mit Steckbrief</span></div><div><b>${SETS.length}</b><span>fertige Terrarien-Pakete</span></div><div><b>${FEED.length}</b><span>Futtersorten erklärt</span></div></div>`}
function vMine(){let h=`${topBar(true,true)}<h1>Meine Terrarien</h1><p class="hint">${D.list.length} ${D.list.length==1?"Terrarium":"Terrarien"} · ${plus()?"Plus aktiv":"Basis"}</p>`;
D.list.forEach(x=>{const keep=A;A=x;const R=rate(),due=TK(x).filter(t=>dueIn(x,t)<=0).length,n=chosen().reduce((q,y)=>q+cntOf(y),0),art=x.photo?`<img class="ph" src="${x.photo}" alt="Foto von ${esc(x.name)}">`:svg(),dm=dims();A=keep;
h+=`<article class="c tank"><div class="art">${art}<div class="shade"></div><div class="badges"><span class="tag mu">${x.mode=="have"?"Vorhanden":"In Planung"}</span>${due?`<span class="tag er">${due} Aufgabe${due>1?"n":""} fällig</span>`:'<span class="tag ok">Alles erledigt</span>'}</div></div><div class="tbody"><div class="tinfo"><h2>${esc(x.name)}</h2><div class="mu">${dm.every(Boolean)?dm.join(" × ")+" cm · ":""}${esc(x.cl)} · ${n==1?"1 Tier":n+" Tiere"}</div></div>${ring(R.s,58)}</div><div class="acts"><button class="b sm" onclick="openA(${x.id},'det')">Ansehen</button><button class="ibtn" onclick="openA(${x.id},'wiz',${x.mode=="have"?1:0})" aria-label="Foto">${ic("cam")}</button><button class="ibtn" onclick="openA(${x.id},'wiz')" aria-label="Bearbeiten">${ic("edit")}</button><button class="ibtn" onclick="delA(${x.id})" aria-label="Löschen">${ic("trash")}</button></div></article>`});
return h+adCard()+`<button class="b" onclick="go('start')">${ic("plus")}Weiteres Terrarium hinzufügen</button>`}
function planCard(){if(A.mode!="plan")return"";const st=A.plan.length?A.plan:STARTPLAN;A.pd=A.pd||[];
return `<div class="c"><h2>Dein Weg zum ersten Tier</h2>${st.map((t,i)=>{const on=A.pd.includes(i);return `<div class="row"><span class="task"><span class="ck ${on?"on":""}">${on?ic("check"):""}</span><span>${esc(t)}</span></span><button class="b sm ${on?"s":""}" onclick="togStep(${i})">${on?"Zurück":"Erledigt"}</button></div>`}).join("")}<p class="mu" style="margin-top:10px">${A.started?`<span>Technik läuft seit</span> <b data-notr>${fmtD(A.started)}</b><br><span>Tier frühestens ab</span> <b data-notr>${fmtD(A.started+7*DAY)}</b><br><span>Nur wenn Temperatur und Luftfeuchtigkeit stabil sind.</span>`:"Sobald die Technik läuft, starte die Probephase."}</p>${A.started?"":'<button class="b" onclick="A.started=Date.now();save();render()">Technik läuft (Probephase starten)</button>'}</div>`}
function togStep(i){A.pd=A.pd||[];const k=A.pd.indexOf(i);if(k>-1)A.pd.splice(k,1);else A.pd.push(i);save();render()}
function vDet(){const R=rate(),ck=check(),n=chosen().reduce((q,x)=>q+cntOf(x),0),tasks=TK(A),due=tasks.filter(t=>dueIn(A,t)<=0).length,dm=dims();
let h=`${topBar(false,true)}<div class="eyebrow">${A.mode=="have"?"Vorhandenes Terrarium":"Terrarium in Planung"} · ${esc(A.cl)}</div><h1>${esc(A.name)}</h1><div class="seg" role="tablist">${[["ueb","Status"],["tiere","Tiere"],["pflege","Pflege"],["zucht","Zucht"],["hilfe","Hilfe"]].map(([k,l])=>`<button role="tab" aria-selected="${DT==k}" class="${DT==k?"on":""}" onclick="dt('${k}')">${l}${k=="pflege"&&due?`<span class="dot">${due}</span>`:""}</button>`).join("")}</div>`;
if(DT=="ueb"){
h+=`<div class="c sum">${ring(R.s,92)}<div><h2>${R.s>=80?"Sehr gut!":R.s>=55?"Okay, mit Luft nach oben":"Bitte nachbessern"}</h2><p class="mu">${R.p.length?R.p.length+" Hinweis"+(R.p.length>1?"e":"")+" weiter unten":"Keine Probleme gefunden."}</p></div></div>`;
h+=`<div class="stats"><div><b style="${dm.every(Boolean)&&dm.join("×").length>7?"font-size:14px;line-height:21px":""}">${dm.every(Boolean)?dm.join("×"):"?"}</b><span>cm</span></div><div><b>${n}</b><span>Tiere</span></div><div><b>${ranges().temp[1]}°</b><span>Tag max.</span></div><div><b>${due}</b><span>fällig</span></div></div>`;
h+=planCard();
h+=`<div class="c"><h2>Was auffällt</h2>${R.p.length?R.p.map(p=>`<div class="row"><span class="tag ${p[0]}">${p[0]=="er"?"Wichtig":"Hinweis"}</span><span style="flex:1">${esc(p[1])}</span></div>`).join(""):"<p>Alles im grünen Bereich.</p>"}${R.t.map(t=>`<p class="mu tipline">${ic("spark")}<span>${esc(t)}</span></p>`).join("")}</div>`;
if(R.lg.length)h+=`<div class="c"><h2>Rechtliches</h2>${R.lg.map(t=>`<p class="tipline">${ic("law")}<span>${esc(t)}</span></p>`).join("")}<p class="mu">Ohne Gewähr. Die Regeln unterscheiden sich je nach Land und Bundesland, frage im Zweifel deine Behörde.</p></div>`;
if(ck.length)h+=`<div class="c"><h2>Klima-Messwerte</h2>${ck.map(x=>`<div class="row"><div><span class="tag ${x.st}">${x.st=="ok"?"Optimal":x.st=="wa"?"Leicht daneben":"Handeln"}</span> <b>${esc(N[x.k])}: ${x.v}</b>${x.m?`<div class="mu">Was tun? ${esc(x.m)}</div>`:""}</div></div>`).join("")}${A.mode=="have"?`<button class="b s" onclick="openA(${A.id},'wiz',SK().indexOf('werte'))">Neue Werte eintragen</button>`:""}</div>`;
else if(A.mode=="have")h+=`<div class="c"><h2>Klima-Messwerte</h2><p class="mu">Noch keine Messwerte eingetragen. Mit Werten prüft die App, ob Temperatur und Luftfeuchtigkeit passen.</p><button class="b s" onclick="openA(${A.id},'wiz',SK().indexOf('werte'))">${ic("thermo")}Werte eintragen</button></div>`}
if(DT=="tiere"){
h+=`<div class="c">${A.photo?`<img class="ph" src="${A.photo}" alt="Foto deines Terrariums"><p class="mu">Darunter die Illustration mit wählbarem Bodengrund:</p>`:""}${svg()}<label class="lb">Bodengrund ausprobieren</label><div class="sw">${Object.keys(SUB).map((k,i)=>`<button class="${k==A.sub?"on":""}" onclick="setSub(${i})">${esc(k)}</button>`).join("")}</div></div>`;
h+=`<div class="c"><h2>Tiere · ${n==1?"1 Tier":n+" Tiere"}</h2>${A.an.length?A.an.map(x=>`<details><summary><span class="fit">${fishArt(x.n,1,x.d)}<span>${cntOf(x)}× ${esc(x.n)} <span class="mu">${SZ[x.sz][0]}${x.m||x.f?` · ${x.m||0}♂ ${x.f||0}♀`:""}</span></span></span></summary>${steck(x.d)}</details>`).join(""):'<p class="mu">Noch keine Tiere eingetragen.</p>'}${spaceHtml()}<button class="b s" onclick="openA(${A.id},'wiz',SK().indexOf('tiere'))">${ic("paw")}Tiere ändern</button></div>`;
h+=`<div class="c"><h2>Futter</h2><p>${esc((A.foods||[]).join(", ")||"Noch nichts gewählt")} · ${fq(A.fpw)}</p><p class="mu">${esc(feedAdvice())}</p><button class="b s" onclick="openA(${A.id},'wiz',SK().indexOf('futter'))">${ic("food")}Futter anpassen</button></div>`}
if(DT=="pflege"){
h+=`<div class="c"><h2>Pflegeplan</h2>${tasks.map(t=>{const d=dueIn(A,t);return `<div class="row"><span class="task"><span class="itile">${ic(t[3])}</span><span><b>${esc(t[1])}</b><span class="mu" style="display:block">${t[2]==1?"täglich":"alle "+t[2]+" Tage"} · ${d<=0?'<span style="color:var(--er);font-weight:700">fällig</span>':"in "+d+" Tag"+(d>1?"en":"")}</span></span></span><button class="b sm ${d<=0?"":"s"}" onclick="doneT('${t[0]}')">Erledigt</button></div>`}).join("")}</div>`;
if(chosen().some(x=>!isInv(x.d)))h+=`<div class="c"><h2>Gesundheitscheck</h2><p class="mu">Einmal im Monat kurz prüfen:</p>${HEALTH.map(t=>`<p class="mu tipline">${ic("heart")}<span>${esc(t)}</span></p>`).join("")}<p class="mu">Bei Auffälligkeiten zum reptilienkundigen Tierarzt.</p></div>`;
if(A.note)h+=`<div class="c"><h2>KI-Einschätzung zum Foto</h2><p>${esc(A.note)}</p>${(A.tips||[]).map(t=>`<p class="mu tipline">${ic("spark")}<span>${esc(t)}</span></p>`).join("")}</div>`}
if(DT=="zucht")h+=zuchtView();
if(DT=="hilfe")h+=helpCard();
return h+adCard()}
function setSub(i){const k=Object.keys(SUB)[i];A.sub=k;A.subTxt=k;save();render()}
function doneT(id){A.done[id]=Date.now();save();render();toast("Erledigt ✓")}
function vSet(){if(STORE)return `${topBar(false,true)}<h1>Einstellungen</h1><div class="c"><h2>Sprache</h2><button class="b s" onclick="langSheet()">${ic("globe")}<span data-notr>${LANGS.find(x=>x[0]==LANG)[1]}</span></button></div><div class="c"><h2>Rechtliches</h2><p><a class="lnk" href="datenschutz.html">Datenschutz</a></p><p><a class="lnk" href="impressum.html">Impressum</a></p><p class="mu">Version 1.0</p></div><div class="c"><h2>Daten</h2><p class="mu">Deine Terrarien werden nur auf diesem Gerät gespeichert.</p><button class="b s" onclick="ask('Alle Terrarien und Einstellungen löschen?',()=>{const l=D.lang;D={list:[],trial:0,sub:false,seen:false,adi:0,lang:l};save();view='start';render()})">Alles zurücksetzen</button></div>`;
const s=D.sub?"Plus aktiv (Demo)":plus()?`Testphase läuft noch ${trialDays()} Tag(e)`:D.trial?"Testphase abgelaufen: Basis mit Werbung":"Basis mit Werbung";
return `${topBar(false,true)}<h1>Einstellungen</h1><div class="c"><h2>Dein Abo</h2><p><b>${s}</b></p><p class="mu">Plus: 7 Tage gratis, dann 1,99 €/Monat für 3 Monate, danach 0,99 €/Monat. Demo: es wird nichts abgebucht.</p><button class="b" onclick="paywall('ads')">Plus ansehen</button></div><div class="c"><h2>Demo-Werkzeuge zum Testen</h2><button class="b s" onclick="startTrial()">Testphase starten</button><button class="b s" onclick="D.trial=Date.now()-8*DAY;D.sub=false;save();render()">Testphase abgelaufen simulieren</button><button class="b s" onclick="D.sub=true;save();render()">Abo aktiv simulieren</button><button class="b s" onclick="D.sub=false;D.trial=0;save();render()">Auf Basis zurücksetzen</button></div><div class="c"><h2>Daten</h2><button class="b s" onclick="ask('Alle Terrarien und Einstellungen löschen?',()=>{D={list:[],trial:0,sub:false,seen:false,adi:0};save();view='start';render()})">Alles zurücksetzen</button></div>`}

/* ---------- Rendern ---------- */
function render(){try{render0()}catch(e){console.error(e);$("app").innerHTML='<div class="c"><h2>Hoppla</h2><p class="mu">Etwas ist schiefgelaufen ('+esc(e&&e.message||e)+'). Deine Daten sind noch da.</p><button class="b" onclick="view=\'start\';render()">Zur Startseite</button><button class="b s" onclick="ask(\'Alle Daten löschen?\',()=>{try{localStorage.removeItem(\'tp1\')}catch(e){}location.reload()})">Alles zurücksetzen</button></div>';$("bar").style.display="none"}}
function render0(){const a=$("app");let bar="";
if(view=="start")a.innerHTML=vStart();
else if(view=="mine")a.innerHTML=vMine();
else if(view=="wiz"){a.innerHTML=vWiz();bar=`<button class="b s" onclick="back()">${ic("back")}Zurück</button><button class="b" onclick="next()">${step>=SK().length-1?"Fertig":"Weiter"+ic("chev")}</button>`}
else if(view=="det"){a.innerHTML=vDet();bar=`<button class="b s" onclick="openA(${A.id},'wiz')">Bearbeiten</button><button class="b" onclick="go('mine')">Übersicht</button>`}
else if(view=="set"){a.innerHTML=vSet();bar=`<button class="b" onclick="go('${D.list.length?"mine":"start"}')">Zurück</button>`}
const b=$("bar");b.style.display=bar?"flex":"none";b.innerHTML=bar;
const showAd=!plus()&&view=="wiz";const e=$("ad");e.style.display=showAd?"flex":"none";
if(showAd)e.innerHTML=`<span class="al">Anzeige</span><span class="t">${esc(adTxt())}</span><button onclick="paywall('ads')" aria-label="Werbung entfernen">✕</button>`;
const bh=bar?b.offsetHeight:0;e.style.bottom=bh+"px";document.body.style.paddingBottom=(bh+(showAd?e.offsetHeight:0)+20)+"px";
if(view=="wiz")afterWiz()}
bootLang();

(function(){const cv=$("dust");if(!cv||!cv.getContext)return;const cx=cv.getContext("2d"),rm=matchMedia("(prefers-reduced-motion: reduce)").matches,B=[];let W=0,H=0,d=1;
function rs(){d=Math.min(2,devicePixelRatio||1);W=cv.width=innerWidth*d;H=cv.height=innerHeight*d}rs();addEventListener("resize",rs);
for(let i=0;i<34;i++)B.push({x:Math.random(),y:Math.random(),r:.6+Math.random()*1.8,s:.0002+Math.random()*.0006,w:Math.random()*6.28,g:Math.random()<.35});
function draw(){cx.clearRect(0,0,W,H);const t=performance.now()/1000;B.forEach(b=>{if(!rm){b.y-=b.s;b.w+=.012;if(b.y<-.05){b.y=1.05;b.x=Math.random()}}const x=(b.x+Math.sin(b.w)*.02)*W,y=b.y*H,r=b.r*d,a=b.g?(.35+.45*Math.abs(Math.sin(t*1.3+b.w))):.25;cx.beginPath();cx.arc(x,y,r*(b.g?1.6:1),0,6.283);cx.fillStyle=b.g?`rgba(255,214,120,${a})`:`rgba(255,236,210,${a})`;cx.fill()});if(!rm)requestAnimationFrame(draw)}draw()})();
</script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</body>
