<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="aq-store" content="1">
<title>AquaPlaner</title>
<meta name="description" content="AquaPlaner: Aquarium planen, Besatz prüfen, Wasserwerte, Futter und Pflege im Blick.">
<meta name="theme-color" content="#031118">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
:root{
/* Layout: eine Spalte wie eine App; Glaskarten schweben über einer Unterwasserszene; Aktionen unten fixiert */
--abyss:#031118;--deep:#062631;--reef:#0b4a57;
--glass:rgba(173,232,244,.075);--glass2:rgba(173,232,244,.14);--line:rgba(160,225,240,.17);--well:rgba(2,20,27,.5);
--fg:#eaf8fb;--mu:#9ac0c8;--aqua:#7fe0ee;--coral:#ff9a62;--coral-ink:#2b1306;
--ok:#5fd69a;--wa:#f6c35a;--er:#ff6b7d;
--f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
--f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
--r:20px;
--bg:var(--abyss);--card:var(--glass);--tx:var(--fg);--ac:var(--coral);--on:var(--coral-ink);--bd:var(--line);
color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--abyss)}
.sea{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:radial-gradient(120% 55% at 50% -12%,#11707f 0%,rgba(17,112,127,0) 62%),linear-gradient(180deg,#0a4150 0%,#06303b 38%,#041a22 72%,#031118 100%)}
.sea::before{content:"";position:absolute;inset:-10% -30% 30%;background:repeating-linear-gradient(104deg,rgba(190,245,255,0) 0 70px,rgba(190,245,255,.055) 70px 105px,rgba(190,245,255,0) 105px 190px);-webkit-mask:linear-gradient(180deg,#000,transparent 85%);mask:linear-gradient(180deg,#000,transparent 85%);animation:rays 14s ease-in-out infinite alternate}
.caustic{position:absolute;inset:-25%;opacity:.28;mix-blend-mode:screen;background:radial-gradient(closest-side at 20% 30%,rgba(160,240,255,.5),transparent 70%),radial-gradient(closest-side at 70% 20%,rgba(160,240,255,.35),transparent 70%),radial-gradient(closest-side at 55% 60%,rgba(120,220,240,.25),transparent 70%);filter:blur(30px);animation:drift 22s ease-in-out infinite alternate}
.sea::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(180deg,transparent,rgba(1,8,11,.7))}
#bub{position:absolute;inset:0;width:100%;height:100%}
@keyframes rays{from{transform:translateX(-3%) skewX(-2deg)}to{transform:translateX(3%) skewX(2deg)}}
@keyframes drift{from{transform:translate(-4%,-2%) scale(1)}to{transform:translate(4%,3%) scale(1.08)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding-block:22px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font:800 30px/1.1 var(--f-display);letter-spacing:-.015em;margin:2px 0 8px;text-wrap:balance}
h2{font:700 18px/1.25 var(--f-display);margin:0 0 10px;text-wrap:balance}
p{margin:.4em 0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--aqua)}
.hint{color:var(--mu);margin:0 0 14px}
.c{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);box-shadow:0 14px 34px -22px rgba(0,0,0,.8)}
.mu{color:var(--mu);font-size:14px}.center{text-align:center}
button,select,input,textarea{font:inherit;color:var(--fg)}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--aqua);outline-offset:2px}
.ic{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em}
.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--coral);color:var(--coral-ink);border:0;border-radius:14px;padding:13px 18px;width:100%;margin-top:10px;font-weight:700;font-size:16px;box-shadow:0 10px 22px -12px rgba(255,154,98,.8);transition:transform .12s,filter .12s}
.b:hover{filter:brightness(1.06)}.b:active{transform:scale(.98)}
.b.s{background:rgba(127,224,238,.06);color:var(--aqua);border:1.5px solid rgba(127,224,238,.42);box-shadow:none}
.b.sm{width:auto;padding:9px 14px;margin:0;font-size:14px;white-space:nowrap}
input,select,textarea{background:var(--well);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--aqua);outline:none}
select option{background:var(--deep)}
input::placeholder,textarea::placeholder{color:#6f949c}
.lb{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:18px 0 8px}.lb:first-child{margin-top:0}
.r{display:flex;gap:8px;align-items:center;margin:10px 0}.r input,.r select{flex:1;min-width:0}
.r3{display:flex;gap:8px}.r3 input{flex:1;min-width:0}
.wv{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.wv:last-child{border:0}.wv label{flex:1;min-width:0}.wv input{width:104px;text-align:right;font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.row>div,.row>span{min-width:0}
.q{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}.q button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--glass2);font-size:18px;line-height:1}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap;vertical-align:middle}
.tag.ok{background:rgba(95,214,154,.16);color:var(--ok)}.tag.wa{background:rgba(246,195,90,.16);color:var(--wa)}.tag.er{background:rgba(255,107,125,.16);color:var(--er)}.tag.mu{background:rgba(154,192,200,.16);color:var(--mu)}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--well);font-size:14.5px;transition:background .15s,border-color .15s}
.sw button:hover{border-color:rgba(127,224,238,.45)}
.sw.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 6px;-webkit-mask:linear-gradient(90deg,transparent,#000 16px,#000 calc(100% - 28px),transparent);mask:linear-gradient(90deg,transparent,#000 16px,#000 calc(100% - 28px),transparent)}.sw.scroll::-webkit-scrollbar{display:none}.sw.scroll button{flex:none}
.sw button.on{background:rgba(127,224,238,.16);border-color:var(--aqua);color:#fff;font-weight:700}
.score{font:800 52px/1 var(--f-display);text-align:center}
svg.tankart,img.ph{width:100%;max-width:100%;height:auto;border-radius:14px;display:block}
details{border-top:1px solid var(--line);padding:4px 0}details:first-of-type{border-top:0}
details summary{cursor:pointer;padding:8px 0;font-weight:600}
details summary::marker{color:var(--aqua)}
pre.ans{white-space:pre-wrap;font:inherit;background:var(--well);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0 0}pre.ans:empty{display:none}
/* App-Rahmen */
.gear{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:18px;width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--glass);color:var(--fg);display:grid;place-items:center;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.ibtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--glass2);color:var(--fg);display:grid;place-items:center;flex:none}
.itile{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;background:rgba(127,224,238,.12);border:1px solid rgba(127,224,238,.3);color:var(--aqua);flex:none}
.itile .ic{width:26px;height:26px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:none;gap:10px;justify-content:center;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(0deg,rgba(3,17,24,.97) 62%,rgba(3,17,24,0))}
.bar button{margin:0;flex:1;max-width:300px}.bar .b.s{flex:0 1 38%}
.ad{position:fixed;left:0;right:0;z-index:5;display:none;align-items:center;gap:10px;background:rgba(6,38,49,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:7px max(16px,env(safe-area-inset-right,0px)) 7px max(16px,env(safe-area-inset-left,0px));font-size:13px;color:var(--mu)}
.ad .al,.adc .al{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.ad span.t{flex:1;min-width:0}.ad button,.adc button{background:none;border:0;font-size:16px;color:var(--mu);padding:6px 8px}
.adc{display:flex;align-items:center;gap:10px;border:1px dashed var(--line);border-radius:16px;padding:10px 12px;font-size:13px;margin-bottom:12px;color:var(--mu)}.adc span.t{flex:1}
.ov{position:fixed;inset:0;background:rgba(1,9,12,.62);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sh{background:linear-gradient(180deg,#0c4452 0%,#062631 60%);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:24px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));width:100%;max-width:560px;max-height:92vh;overflow:auto;animation:up .28s ease-out}
.pw-ic{width:60px;height:60px;margin:0 auto 6px;border-radius:18px;display:grid;place-items:center;background:var(--coral);color:var(--coral-ink)}.pw-ic .ic{width:30px;height:30px}
.perks{background:var(--well);border:1px solid var(--line);border-radius:14px;padding:12px 14px;line-height:1.95;margin:12px 0}
.tl{border-left:2px solid var(--coral);padding-left:14px;margin:12px 0 12px 4px}.tl div{margin:6px 0}
.toast{pointer-events:none;position:fixed;left:50%;transform:translateX(-50%);bottom:110px;width:max-content;max-width:calc(100% - 48px);text-align:center;background:var(--fg);color:var(--abyss);font-weight:600;padding:10px 16px;border-radius:16px;font-size:14px;z-index:30;box-shadow:0 10px 30px -10px rgba(0,0,0,.7);animation:up .2s ease-out}
.fl{position:relative;overflow:hidden;display:flex;flex:1;align-items:center;justify-content:center;gap:8px;cursor:pointer}.fl input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:0;cursor:pointer}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 16px;min-height:44px}
.brand{display:flex;align-items:center;gap:8px;font:800 17px/1 var(--f-display)}.brand .ic{color:var(--coral);width:24px;height:24px}
.tools{display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:7px;height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--glass);color:var(--fg);font-weight:700;font-size:14px;letter-spacing:.05em;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.pill .ic{color:var(--aqua)}
.lang-opt{display:flex;justify-content:space-between;align-items:center;width:100%;padding:15px 16px;margin-top:8px;border-radius:14px;border:1px solid var(--line);background:var(--well);font-size:17px;font-weight:600}.lang-opt.on{border-color:var(--aqua);background:rgba(127,224,238,.12)}.lang-opt .ic{color:var(--aqua)}
.lload #app,.lload .bar,.lload .ad{visibility:hidden}
.lnk{color:var(--aqua);font-weight:600}
.fart{display:block;width:92px;height:58px;flex:none;border-radius:14px;background:radial-gradient(120% 90% at 35% 25%,rgba(127,224,238,.22),rgba(2,20,27,.55));border:1px solid var(--line)}
.fart.sm{width:60px;height:40px;border-radius:11px}
.fhead{display:flex;gap:12px;align-items:center}.ft{min-width:0}
.fit{display:flex;gap:10px;align-items:center;min-width:0}
summary .fit{display:inline-flex;vertical-align:middle}
.fishrow{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
/* Start */
.hero{position:relative;padding:8px 0 10px;min-height:200px}
.hero .logo{font-size:44px;margin:6px 0 10px;background:linear-gradient(90deg,#fff 0%,#bff4fb 60%,var(--aqua) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:60%;color:var(--mu);margin:0}
.herofish{position:absolute;right:-6px;top:104px;width:37%;max-width:160px;animation:bob 6s ease-in-out infinite;filter:drop-shadow(0 16px 20px rgba(0,0,0,.45))}
.q-title{font-size:20px;margin:26px 0 4px}
.choice{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;margin-top:12px;padding:18px 16px;border-radius:22px;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:transform .15s,border-color .15s}
.choice:hover{border-color:rgba(127,224,238,.5)}.choice:active{transform:scale(.985)}
.choice.prim{background:linear-gradient(135deg,rgba(255,154,98,.2),rgba(255,154,98,.05));border-color:rgba(255,154,98,.45)}
.choice.prim .itile{background:var(--coral);border-color:transparent;color:var(--coral-ink)}
.choice .ct{min-width:0}.choice .ct b{display:block;font:700 17px/1.25 var(--f-display)}.choice .ct span{display:block;color:var(--mu);font-size:14px;margin-top:3px}
.choice>.ic{color:var(--mu)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.facts div{border-top:1px solid var(--line);padding-top:10px}.facts b{display:block;font:800 22px/1.1 var(--f-display);color:var(--aqua);font-variant-numeric:tabular-nums}.facts span{font-size:12.5px;color:var(--mu)}
/* Assistent */
.whdr{display:flex;gap:14px;align-items:center;margin:6px 0 8px}.whdr h1{margin:2px 0 0}
.prog{display:flex;gap:4px;margin:0 0 18px}.prog i{flex:1;height:4px;border-radius:2px;background:var(--line);transition:background .3s}.prog i.done{background:rgba(127,224,238,.55)}.prog i.on{background:var(--coral)}
.dots{display:none}
/* Aquarien */
.tank{padding:0;overflow:hidden}
.tank .art{position:relative}.tank .art svg,.tank .art img{border-radius:0;aspect-ratio:36/16;object-fit:cover}
.tank .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,17,24,0) 45%,rgba(3,17,24,.55))}
.tank .badges{position:absolute;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap}
.tank .badges .tag{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);background:rgba(3,17,24,.62)}
.tbody{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px 4px}.tbody h2{margin:0 0 2px}.tinfo{min-width:0}
.acts{display:flex;gap:8px;align-items:center;padding:10px 16px 16px}.acts .b.sm{flex:1}
.ring{flex:none;display:block}
.seg{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:5px;margin:8px 0 14px;border-radius:999px;background:rgba(3,17,24,.72);border:1px solid var(--line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.seg button{border:0;background:none;color:var(--mu);border-radius:999px;padding:9px 4px;font-size:14px;font-weight:600;white-space:nowrap}
.seg button.on{background:var(--glass2);color:var(--fg)}
.seg .dot{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--coral);color:var(--coral-ink);font-size:11px;font-weight:800;margin-left:2px}
.sum{display:flex;gap:16px;align-items:center}.sum h2{margin:0 0 4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stats div{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:10px 8px;text-align:center}
.stats b{display:block;font:800 21px/1.1 var(--f-display);font-variant-numeric:tabular-nums}.stats span{font-size:12px;color:var(--mu)}
.ck{width:26px;height:26px;border-radius:50%;border:1.5px solid rgba(127,224,238,.5);display:grid;place-items:center;flex:none;color:var(--abyss)}.ck.on{background:var(--ok);border-color:var(--ok)}.ck .ic{width:16px;height:16px;stroke-width:2.6}
.tipline{display:flex;gap:8px;align-items:flex-start}.tipline .ic{color:var(--aqua);margin-top:2px}
.task{display:flex;gap:12px;align-items:center;flex:1;min-width:0}.task .itile{width:40px;height:40px;border-radius:12px}.task .itile .ic{width:20px;height:20px}
@media (max-width:380px){h1{font-size:26px}.hero .logo{font-size:38px}.stats{grid-template-columns:repeat(2,1fr)}.facts b{font-size:19px}}
@media (prefers-reduced-motion:reduce){.sea::before,.caustic,.herofish{animation:none}.sh,.toast{animation:none}}
</style>
</head>
<body>
<div class="sea" aria-hidden="true"><div class="caustic"></div><canvas id="bub"></canvas></div>
<main id="app"></main>
<div class="ad" id="ad"></div><div class="bar" id="bar"></div><div id="sheet"></div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>(v===""||v==null||isNaN(v))?null:parseFloat(v);

function lev(a,b){const m=[];for(let i=0;i<=a.length;i++)m[i]=[i];for(let j=1;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return m[a.length][b.length]}
function wd(t,k){const kw=k.toLowerCase().split(/\s+/);let s=0;t.toLowerCase().split(/\s+/).forEach(w=>{s+=Math.min(...kw.map(x=>lev(w,x)))});return s}
function bsug(){const t=$("bi").value.trim(),ks=Object.keys(SUB),ex=ks.find(k=>k.toLowerCase()==t.toLowerCase());if(ex){A.sub=ex;A.subTxt=ex}else A.subTxt=t;save();
const Ls=ks.slice().sort((a,b)=>wd(t,a)-wd(t,b));
$("bs").innerHTML=(ex?`<p class="mu" style="flex:1 1 100%">✓ Erkannt: ${esc(ex)}</p>`:`<p class="mu" style="flex:1 1 100%">${t?"Meintest du:":"Auswahl:"}</p>`)+Ls.map((k,i)=>`<button class="${ex==k?"on":""}" onclick="bpick(${ks.indexOf(k)})">${esc(k)}</button>`).join("")}
function bpick(i){const k=Object.keys(SUB)[i];A.sub=k;A.subTxt=k;save();$("bi").value=k;bsug()}

function localRes(q){q=q.trim().toLowerCase();if(!q)return[];const rows=[];FD.forEach(f=>{const bm=f.n.toLowerCase().includes(q);if(bm)rows.push(f);f.vars.forEach(v=>{if(bm||v.toLowerCase().includes(q))rows.push(Object.assign({},f,{n:v,desc:"Zuchtform von "+f.n,vars:[]}))})});return rows.slice(0,8)}
const closest=q=>FD.map(f=>[wd(q,f.n),f.n]).sort((a,b)=>a[0]-b[0]).slice(0,3).map(x=>x[1]);
async function doSearch(){const q=$("q").value.trim();Q=q;NOTE=null;CATI=-1;if(!q){RES=[];drawRes();return}
RES=localRes(q);

$("rs").innerHTML='<p class="mu">Die KI sucht und prüft …</p>';
try{const r=await aiJson(`Du bist Aquaristik-Experte. Ein Nutzer sucht für sein Aquarium diesen Fisch oder Wirbellosen: "${q.replace(/"/g,"'")}". Antworte NUR als JSON: {"existiert":true|false|"unsicher","hinweis":"kurz, deutsch","vorschlaege":["echte Namen, die dem Suchbegriff am nächsten kommen"],"ergebnisse":[FISCH],"aehnlichster":FISCH oder null} mit FISCH = ${FS}. Regeln: Bei Oberbegriffen (z. B. Guppy) liefere die Art und bekannte Zuchtformen als einzelne Ergebnisse (bis 6). Erfinde niemals Arten oder Zuchtformen. Gibt es den Namen offiziell nicht, setze existiert=false, ergebnisse=[] und nenne in vorschlaege echte ähnliche Namen. Werte realistisch angeben.`);
const res=(Array.isArray(r.ergebnisse)?r.ergebnisse:[]).slice(0,6).map(nrm);const sug=(Array.isArray(r.vorschlaege)?r.vorschlaege:[]).slice(0,4).map(x=>String(x).slice(0,50));
if(r.existiert===false||!res.length){RES=[];NOTE={t:"nf",hint:String(r.hinweis||"Diesen Namen gibt es offiziell nicht."),sug,near:r.aehnlichster?nrm(r.aehnlichster):null}}
else{RES=res;if(r.existiert==="unsicher")NOTE={t:"info",hint:String(r.hinweis||"Ich bin mir bei diesem Namen nicht sicher, bitte prüfe die Angaben.")}}}
catch(e){NOTE={t:"err",hint:aerr(e)};if(!RES.length)NOTE.sug=closest(q)}
drawRes()}
async function ideas(){if(!needPlus("ki"))return;$("rs").innerHTML='<p class="mu">Die KI sammelt Ideen …</p>';Q="";if($("q"))$("q").value="";NOTE=null;
try{const r=await aiJson(`Du bist Aquaristik-Experte. Schlage 6 Tiere vor, die gut zu diesem Aquarium und zueinander passen: ${ctx()} Berücksichtige Wasserart, Größe, Ziel, Erfahrung und den vorhandenen Besatz (keine Konflikte). Antworte NUR als JSON: {"ideen":[FISCH]} mit FISCH = ${FS}.`);RES=(Array.isArray(r.ideen)?r.ideen:[]).slice(0,6).map(nrm);NOTE={t:"info",hint:"KI-Ideen für dein Becken. Die Angaben sind Richtwerte, prüfe sie vor dem Kauf."}}
catch(e){RES=[];NOTE={t:"err",hint:aerr(e)}}drawRes()}
const steck=f=>`<div class="mu" style="margin:6px 0">Wasser: ${esc(f.w)} · Temperatur ${f.t[0]}–${f.t[1]} °C · pH ${f.ph[0]}–${f.ph[1]}${f.w=="Süßwasser"?" · GH "+f.gh[0]+"–"+f.gh[1]:""}<br>Größe bis ${f.s} cm · ca. ${f.l} l pro Tier · ab ${f.g} Tier(en) halten<br>Futter: ${esc(f.food)}<br>Füttern: ca. ${f.times}× täglich<br>${f.tags.length?"Verhalten: "+esc(f.tags.join(", "))+"<br>":""}${esc(f.note)}</div>`;
function resCard(f,i){return `<div class="c" style="margin:8px 0"><div class="fhead">${fishArt(f.n)}<div class="ft"><b>${esc(f.n)}</b> <span class="tag ${f.diff=="leicht"?"ok":f.diff=="schwer"?"er":"wa"}">${f.diff=="leicht"?"Anfänger-geeignet":esc(f.diff)}</span><div class="mu">${[esc(f.desc||f.art),esc(f.w),`${f.t[0]}–${f.t[1]} °C`,`bis ${f.s} cm`].filter(Boolean).join(" · ")}</div></div></div><details><summary class="mu">Steckbrief und Futter</summary>${steck(f)}</details><div class="r"><select id="sz${i}"><option value="baby">Baby</option><option value="mittel">Mittel</option><option value="gross" selected>Ausgewachsen</option></select><button class="b sm" onclick="addRes(${i})">+ Hinzufügen</button></div></div>`}
function drawRes(){const e=$("rs");if(!e)return;let h="";
if(NOTE){if(NOTE.t=="nf"){h+=`<div class="c"><b>Nicht gefunden</b><p>${esc(NOTE.hint)}</p>${(NOTE.sug||[]).length?`<p class="mu">Meintest du:</p><div class="sw">${NOTE.sug.map((s,i)=>`<button onclick="sugg(${i})">${esc(s)}</button>`).join("")}</div>`:""}<button class="b s" onclick="$('q').value='';$('q').focus()">Anderen Fisch suchen</button><button class="b s" onclick="customForm()">Trotzdem mit diesem Namen hinzufügen</button></div>`}
else h+=`<div class="c ${NOTE.t=="err"?"":""}"><span class="tag ${NOTE.t=="err"?"er":"wa"}">${NOTE.t=="err"?"Fehler":"Hinweis"}</span> ${esc(NOTE.hint)}${NOTE.t=="err"&&(NOTE.sug||[]).length?`<div class="sw" style="margin-top:8px">${NOTE.sug.map((s,i)=>`<button onclick="sugg(${i})">${esc(s)}</button>`).join("")}</div>`:""}</div>`}
h+=RES.map(resCard).join("");
if(!plus()&&Q)h+=`<div class="c"><b>Mehr Arten mit Plus</b><p class="mu">Die KI-Suche kennt hunderte Arten und Zuchtformen und prüft Namen auf Echtheit.</p><button class="b s" onclick="paywall('ki')">Plus testen</button></div>`;
e.innerHTML=h}

function pushFish(n,sz,d,custom){const e=A.fish.find(x=>x.n==n&&x.sz==sz);if(e)e.c++;else A.fish.push({n,sz,c:1,d,custom:!!custom});save()}
const dat=f=>({w:f.w,t:f.t,ph:f.ph,gh:f.gh,s:f.s,l:f.l,g:f.g,tags:f.tags,food:f.food,times:f.times,note:f.note,diff:f.diff,art:f.art});
function addRes(i){const f=RES[i],sz=$("sz"+i).value;pushFish(f.n,sz,dat(f));mine();toast(f.n+" hinzugefügt")}

function chg(i,d){A.fish[i].c+=d;if(A.fish[i].c<1)A.fish.splice(i,1);save();mine()}
function mine(){const e=$("mine");if(!e)return;const lb=$("lb");if(lb)lb.innerHTML=lbarHtml();const sc=$("sgc");if(sc){const h=sugHtml();sc.style.display=h?"block":"none";$("sg").innerHTML=h}e.innerHTML=A.fish.length?A.fish.map((x,i)=>`<div class="row"><div class="fit">${fishArt(x.n,1)}<div><b>${esc(x.n)}</b>${x.custom?' <span class="tag mu">eigener Eintrag</span>':""}<div class="mu">${SZ[x.sz][0]}</div></div></div><div class="q"><button onclick="chg(${i},-1)">−</button><b>${x.c}</b><button onclick="chg(${i},1)">+</button></div></div>`).join(""):'<p class="mu">Noch nichts gewählt.</p>'}

function scale(file,max,q){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>res({blob:b,url:c.toDataURL("image/jpeg",q)}),"image/jpeg",q)};im.onerror=rej;im.src=u})}
const phHtml=()=>A.photo?`<img class="ph" src="${A.photo}" alt="Foto">`:svg(SUB[A.sub]||SUB["Heller Sand"])+'<p class="mu">Illustration deines Beckens. Mit Foto wird sie durch dein echtes Bild ersetzt.</p>';
async function pick(inp){const f=inp.files[0];if(!f)return;const st=$("st");st.textContent="Foto wird verarbeitet …";st.style.color="";
try{const big=await scale(f,1024,0.8),sm=await scale(f,480,0.6);A.photo=sm.url;save();$("ph").innerHTML=phHtml();
if(!AIOK){st.textContent="Foto gespeichert.";return}
if(!plus()){st.textContent="Foto gespeichert. Die KI-Erkennung ist Teil von Plus.";return}
st.textContent="KI analysiert dein Becken …";
const r=await aiJson(`Du bist Aquaristik-Experte. Analysiere das Aquarium-Foto. Antworte NUR als JSON: {"aquarium":true|false,"fische":[{"anzahl":0,"groesse":"baby|mittel|gross", ...FISCH-Felder}],"pflanzen":[""],"boden":"","liter":0,"zustand":"kurze Bewertung auf Deutsch (Wasserklarheit, Algen, Pflanzenzustand, Gestaltung)","tipps":[""]} mit FISCH-Feldern wie in ${FS}. Pflanzen nur aus: ${P.map(x=>x[0]).join(", ")}. Boden nur aus: ${Object.keys(SUB).join(", ")}. Unsicheres weglassen, liter=0 wenn unklar. Setze aquarium=false, wenn auf dem Foto kein Aquarium (Becken mit Wasser) zu sehen ist.`,[big.blob]);
if(r.aquarium===false){A.photo="";save();$("ph").innerHTML=phHtml();st.textContent="Auf dem Foto ist kein Aquarium zu erkennen. Bitte mache ein neues Foto, auf dem das Becken gut sichtbar ist.";st.style.color="var(--er)";inp.value="";return}
let n=0;(Array.isArray(r.fische)?r.fische:[]).forEach(x=>{const d=nrm(x),c=Math.max(1,Math.round(+x.anzahl||1)),sz=SZ[x.groesse]?x.groesse:"gross";if(!d.n||d.n=="Unbekannt")return;const e=A.fish.find(y=>y.n==d.n&&y.sz==sz);if(e)e.c=c;else A.fish.push({n:d.n,sz,c,d:dat(d)});n++});
(Array.isArray(r.pflanzen)?r.pflanzen:[]).forEach(p=>{if(P.some(x=>x[0]==p)&&!A.plants.includes(p))A.plants.push(p)});
if(SUB[r.boden]){A.sub=r.boden;A.subTxt=r.boden}if(r.liter>0&&A.mode=="have")A.l=r.liter;A.note=String(r.zustand||"");A.tips=(Array.isArray(r.tipps)?r.tipps:[]).map(String);save();
st.innerHTML=`<span>Fertig: ${n} Tierart(en) und ${A.plants.length} Pflanze(n) eingetragen. Bitte prüfe es in den nächsten Schritten.</span> <span>${esc(A.note)}</span>`}
catch(e){st.innerHTML=`<span>Analyse nicht möglich.</span> <span>${esc(aerr(e))}</span> <span>Du kannst alles manuell eintragen.</span>`}
inp.value=""}

function suggestions(){const keep=A.fish,r0=rate(),base=new Set(r0.p.map(p=>p[1])),out=[];
FD.forEach(f=>{if(f.w!=A.wt||keep.some(x=>x.n==f.n))return;const c=Math.max(f.g,1);A.fish=keep.concat([{n:f.n,sz:"gross",c,d:dat(f)}]);let r;try{r=rate()}finally{A.fish=keep}
if(r.p.some(p=>!base.has(p[1])))return;if(keep.length){const q=ranges();if(Math.min(q.temp[1],f.t[1])-Math.max(q.temp[0],f.t[0])<2||Math.min(q.ph[1],f.ph[1])-Math.max(q.ph[0],f.ph[0])<0.4||(A.wt=="Süßwasser"&&Math.min(q.gh[1],f.gh[1])-Math.max(q.gh[0],f.gh[0])<3))return}out.push({f,c,score:r.s})});
out.sort((a,b)=>(a.f.diff=="leicht"?0:1)-(b.f.diff=="leicht"?0:1)||b.score-a.score||a.f.l-b.f.l);return out.slice(0,5)}

function sugAdd(i){const s=SUGS[i];if(!s)return;addMany(s.f.n,"gross",dat(s.f),s.c);toast(s.f.n+" hinzugefügt");if(view=="wiz")mine();else{render();showImprove()}}
function improve(){const out=[],items=chosen(),L=num(A.l)||0;let load=0;items.forEach(x=>{load+=x.c*x.d.l*SZ[x.sz][1]});
if(L&&load>L){const big=items.slice().sort((a,b)=>b.d.l*SZ[b.sz][1]-a.d.l*SZ[a.sz][1])[0],per=big.d.l*SZ[big.sz][1],n=Math.min(big.c,Math.ceil((load-L)/per));out.push(`Zu voll: gib ${n}× ${big.n} ab oder nimm ein größeres Becken.`)}
const cnt={};items.forEach(x=>{cnt[x.n]=(cnt[x.n]||0)+x.c});
Object.keys(cnt).forEach(n=>{const x=items.find(y=>y.n==n);if(cnt[n]<x.d.g&&x.d.g>1)out.push(`Stocke ${n} auf mindestens ${x.d.g} Tiere auf (aktuell ${cnt[n]}), sonst sind sie gestresst.`);if(x.d.tags.includes("einzelgänger")&&cnt[n]>1)out.push(`${n}: halte nur ein Tier, mehrere streiten.`)});
rate().p.filter(p=>p[0]=="er"&&/frisst|jagt|zupft|braucht|passen nicht/.test(p[1])).forEach(p=>out.push("Konflikt: "+p[1]));return out}

o.innerHTML=(chosen().length?"":'<p class="mu">Du hast noch keinen Besatz eingetragen.</p>')+(L.length?L.map(t=>`<div class="row"><span class="tag wa">!</span><span style="flex:1">${esc(t)}</span></div>`).join(""):(chosen().length?"<p>✓ An deinem Besatz gibt es nichts Grundsätzliches zu ändern.</p>":""))+(sg.length?`<p class="mu" style="margin-top:10px">Passt noch dazu:</p>${sg.map(sugRow).join("")}`:(chosen().length?'<p class="mu">Gerade passt nichts Weiteres dazu (Platz oder Wasserwerte).</p>':""))+(AIOK?'<button class="b s" onclick="improveAI()">Ausführliche Einschätzung von der KI</button><pre class="ans" id="impai"></pre>':"")}

function holdPlan(f){const items=[],L=num(A.l)||0,keep=A.fish;let load=0;chosen().forEach(x=>{load+=x.c*x.d.l*SZ[x.sz][1]});const c=Math.max(f.g,1),need=Math.round(c*f.l);
if(f.w!=A.wt)items.push(["er",`Wasser: ${f.n} braucht ${f.w}, dein Becken hat ${A.wt}. Das lässt sich nicht kombinieren.`]);
if(L){const free=L-load;items.push(need>free?["er",`Platz: ${c} Tiere brauchen ca. ${need} l, bei dir sind nur noch ca. ${Math.max(0,Math.round(free))} l frei. Du bräuchtest ein größeres Becken oder müsstest Tiere abgeben.`]:["ok",`Platz: ${c} Tiere brauchen ca. ${need} l, bei dir sind noch ca. ${Math.round(free)} l frei.`])}
if(f.g>1)items.push(["wa",`Gruppe: Halte mindestens ${f.g} ${f.n}, einzelne Tiere werden gestresst.`]);
if(f.tags.includes("einzelgänger"))items.push(["wa",`${f.n} ist ein Einzelgänger: nur ein Tier halten.`]);
if(chosen().length){const r=ranges();[["Temperatur","temp",f.t,"°C"],["pH","ph",f.ph,""]].concat(A.wt=="Süßwasser"?[["GH","gh",f.gh,"°dH"]]:[]).forEach(([lab,k,fr,u])=>{const lo=Math.max(r[k][0],fr[0]),hi=Math.min(r[k][1],fr[1]);items.push(lo>hi?["er",`${lab}: deine Tiere brauchen ${r[k][0]}–${r[k][1]}${u?" "+u:""}, ${f.n} ${fr[0]}–${fr[1]}${u?" "+u:""}. Das passt nicht zusammen.`]:["ok",`${lab}: stelle ${lo==hi?lo:lo+"–"+hi}${u?" "+u:""} ein.`])})}
else items.push(["ok",`Wasserwerte: Temperatur ${f.t[0]}–${f.t[1]} °C, pH ${f.ph[0]}–${f.ph[1]}${A.wt=="Süßwasser"?", GH "+f.gh[0]+"–"+f.gh[1]:""}.`]);
[["temp",f.t,"Temperatur"],["ph",f.ph,"pH"],["gh",f.gh,"GH"]].forEach(([k,fr,lab])=>{const v=num(A.w[k]);if(v===null||(k=="gh"&&A.wt!="Süßwasser"))return;if(v<fr[0])items.push(["wa",`${lab}: gemessen ${v}, ${f.n} braucht ${fr[0]}–${fr[1]}.`,TIP[k][1]]);else if(v>fr[1])items.push(["wa",`${lab}: gemessen ${v}, ${f.n} braucht ${fr[0]}–${fr[1]}.`,TIP[k][0]])});
A.fish=keep.concat([{n:f.n,sz:"gross",c,d:dat(f)}]);let r1;try{r1=rate()}finally{A.fish=keep}const base=new Set(rate().p.map(p=>p[1]));
r1.p.filter(p=>!base.has(p[1])&&/frisst|jagt|zupft|Einzelgänger/.test(p[1])).forEach(p=>items.push(["er","Verträglichkeit: "+p[1]]));
if(f.t[0]>=22&&A.heater===false)items.push(["wa",`Technik: Du brauchst einen Heizer (mindestens ${f.t[0]} °C).`]);
if(f.tags.includes("revierbildend"))items.push(["wa","Verhalten: revierbildend, plane Verstecke und Sichtschutz durch Pflanzen oder Wurzeln ein."]);
if(f.tags.includes("räuberisch"))items.push(["wa","Verhalten: räuberisch, kleine Mitbewohner werden gefressen."]);
if(f.s>=10)items.push(["wa",`Größe: wird bis ${f.s} cm groß, plane Platz zum Wachsen.`]);
items.push(["ok","Futter: "+f.food+"."]);
items.push(["ok","So setzt du ein: Tüte 20 Minuten im Becken schwimmen lassen, dann nach und nach Beckenwasser zugeben, Licht dimmen. Neue Tiere nach Möglichkeit 2 Wochen separat beobachten, damit keine Krankheiten ins Becken kommen."]);
return items}
